name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('resources/**', 'binaries/**', '.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache (Crates & Target Build)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> src-tauri/target'
          cache-on-failure: false

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Sync version from Git Tag (if tag release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          node scripts/bump-version.mjs $ver

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Slide Up v__VERSION__'
          # Let GitHub build "What's Changed" from the merged commits/PRs so the
          # in-app update modal has a real changelog to display.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          # Publish latest.json + .sig assets so the updater endpoint works.
          # NSIS is preferred for passive in-app updates on Windows.
          updaterJsonPreferNsis: true
          # Version-free asset names (e.g. Slide.Up-x64-setup.exe) make the
          # README "latest/download" links permanent. The action builds the
          # updater URLs from these same names, so in-app updates still work.
          assetNamePattern: '[name]-[arch][setup][ext]'

      - name: Switch README to permanent download links
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = 'https://github.com/bhsorg/slide-up/releases/latest/download/Slide.Up-x64-setup.exe'
          $msi = 'https://github.com/bhsorg/slide-up/releases/latest/download/Slide.Up-x64.msi'
          $row = "| Windows 10 / 11 (64-bit) | [Latest installer (EXE)]($exe) · [MSI]($msi) | Direct download, automatic in-app updates, bundled libmpv |"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin master
          git checkout -B master origin/master
          $content = Get-Content README.md -Raw
          $updated = [regex]::Replace($content, '(?m)^\| Windows 10 / 11 \(64-bit\) \|.*$', $row)
          if ($updated -eq $content) {
            Write-Host 'README already uses permanent download links.'
            exit 0
          }
          Set-Content -Path README.md -Value $updated -NoNewline -Encoding utf8
          git add README.md
          git commit -m 'docs: use permanent latest-installer links'
          git push origin master
