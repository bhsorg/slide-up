name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Build & Release Desktop App
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Git LFS
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: ${{ runner.os }}-lfs-${{ hashFiles('resources/**', 'binaries/**', '.gitattributes') }}
          restore-keys: |
            ${{ runner.os }}-lfs-

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache (Crates & Target Build)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> src-tauri/target'
          cache-on-failure: false

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Sync version from Git Tag (if tag release)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          node scripts/bump-version.mjs $ver

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: 'Slide Up v__VERSION__'
          # Let GitHub build "What's Changed" from the merged commits/PRs so the
          # in-app update modal has a real changelog to display.
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          # Publish latest.json + .sig assets so the updater endpoint works.
          # NSIS is preferred for passive in-app updates on Windows.
          updaterJsonPreferNsis: true
